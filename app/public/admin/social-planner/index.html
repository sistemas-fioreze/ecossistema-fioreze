<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fioreze Marketing Planner</title>
  <link rel="stylesheet" href="/css/modules/social-planner/planner.css">
</head>
<body>
  <div id="plannerApp" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
      <div class="brand"><span class="brand-monogram">F</span><span class="brand-copy"><strong>Fioreze</strong><small id="plannerName">Marketing Planner</small></span><button id="collapseSidebar" class="icon-button collapse-button" type="button" aria-label="Recolher menu" title="Recolher menu"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button></div>
      <nav id="navigation"></nav>
      <div class="sidebar-footer"><a href="/admin/">Central administrativa</a><small>Marketing da Rede Fioreze</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="topbar-title"><button id="openSidebar" class="icon-button menu-button" type="button" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span>Marketing <span class="crumb">/</span> <strong id="viewTitle">Semana</strong></span></div><div class="topbar-right"><span class="internal-tag">INTERNO</span><span id="currentUser"></span></div></header>
      <main id="mainContent" tabindex="-1"><div class="loading-shell"><div class="skeleton title"></div><div class="skeleton toolbar"></div><div class="skeleton grid"></div></div></main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="storyDrawer" class="story-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
  <script type="module" src="/js/modules/social-planner/planner.js"></script>
</body>
</html>
