<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fioreze Marketing Planner</title>
  <link rel="stylesheet" href="/css/modules/social-planner/planner.css">
  <script src="/js/vendor/lucide-erp.min.js" defer></script>
</head>
<body>
  <section id="plannerLogin" class="planner-login" aria-labelledby="plannerLoginTitle" hidden>
    <div class="planner-login-card">
      <img class="planner-login-brand" src="/assets/brand/fioreze-social-planner-logo.png" alt="Fioreze Hotéis">
      <p class="eyebrow">Social Planner</p>
      <h1 id="plannerLoginTitle">Organize o marketing da rede</h1>
      <p class="subtle">Entre com sua conta exclusiva do Planner.</p>
      <form id="plannerLoginForm" class="planner-login-form">
        <label><span>Usuário ou e-mail</span><input name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label><span>Senha</span><input name="password" type="password" autocomplete="current-password" required></label>
        <label class="planner-remember"><input name="remember_me" type="checkbox"><span>Permanecer conectado</span></label>
        <p id="plannerLoginError" class="planner-login-error" role="alert" hidden></p>
        <button class="button primary" type="submit">Entrar</button>
      </form>
      <a class="planner-master-login" href="/admin/?next=%2Fsocialplanner%2Foverview">Entrar como administrador mestre</a>
    </div>
  </section>
  <div id="plannerApp" class="app-shell">
    <header class="topbar">
      <div class="topbar-brand"><button id="openSidebar" class="icon-button menu-button" type="button" aria-label="Abrir menu"><i data-lucide="menu"></i></button><img src="/assets/brand/fioreze-social-planner-logo.png" alt="Fioreze Hotéis"><span id="plannerName">Social Planner</span></div>
      <label class="global-search"><i data-lucide="search"></i><input id="globalPlannerSearch" type="search" placeholder="Buscar conteúdos, campanhas, hotéis..." autocomplete="off"><kbd>Ctrl K</kbd></label>
      <div class="topbar-actions"><button class="button primary quick-create" type="button" data-action="new"><i data-lucide="plus"></i>Criar</button><button class="icon-button" type="button" aria-label="Notificações" title="Notificações"><i data-lucide="bell"></i></button><div class="current-user"><span class="user-avatar" aria-hidden="true">W</span><span><strong id="currentUser"></strong><small>Marketing</small></span></div></div>
    </header>
    <div class="app-body">
      <aside id="sidebar" class="sidebar" aria-label="Navegação principal">
        <div class="sidebar-control"><button id="collapseSidebar" class="icon-button collapse-button" type="button" aria-label="Recolher menu" title="Recolher menu"><i data-lucide="panel-right-close"></i></button></div>
        <nav id="navigation"></nav>
        <div class="sidebar-footer"><a id="centralAdminLink" href="/admin/" hidden>Central administrativa</a><button id="plannerLogout" class="sidebar-logout" type="button"><i data-lucide="log-out"></i><span>Sair</span></button><small>Marketing da Rede Fioreze</small></div>
      </aside>
      <div class="workspace">
        <main id="mainContent" tabindex="-1"><div class="loading-shell"><div class="skeleton title"></div><div class="skeleton toolbar"></div><div class="skeleton grid"></div></div></main>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
  <aside id="storyDrawer" class="story-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
  <script type="module" src="/js/modules/social-planner/planner.js"></script>
</body>
</html>
